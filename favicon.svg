<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g" x1="10" y1="10" x2="54" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <clipPath id="clip">
      <circle cx="32" cy="32" r="26"/>
    </clipPath>
  </defs>

  <!-- Globe fill -->
  <circle cx="32" cy="32" r="26" fill="url(#g)"/>

  <!-- Globe grid lines (clipped to globe) -->
  <g clip-path="url(#clip)" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1">
    <ellipse cx="32" cy="32" rx="10" ry="26"/>
    <ellipse cx="32" cy="32" rx="20" ry="26"/>
    <line x1="6" y1="32" x2="58" y2="32"/>
    <line x1="8" y1="21" x2="56" y2="21"/>
    <line x1="8" y1="43" x2="56" y2="43"/>
  </g>

  <!-- Night shadow on right hemisphere -->
  <path d="M32 6 A26 26 0 0 1 32 58 A17 26 0 0 0 32 6" fill="rgba(0,8,32,0.38)"/>

  <!-- Outer clock ring -->
  <circle cx="32" cy="32" r="30" fill="none" stroke="#1d4ed8" stroke-width="2.8"/>

  <!-- Amber arc — top-right quarter (time position indicator) -->
  <path d="M32 2 A30 30 0 0 1 62 32" fill="none" stroke="#f59e0b" stroke-width="3.8" stroke-linecap="round"/>

  <!-- Clock hands -->
  <line x1="32" y1="32" x2="32" y2="17" stroke="white" stroke-width="2.4" stroke-linecap="round"/>
  <line x1="32" y1="32" x2="43" y2="39" stroke="white" stroke-width="2" stroke-linecap="round"/>

  <!-- Center dot -->
  <circle cx="32" cy="32" r="2.4" fill="white"/>
</svg>
